<!doctype html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Source Sans Pro", system-ui, sans-serif; color: #3b3a4a; }
  .wrap { background: #fff; border-radius: 16px; padding: 18px 22px;
          box-shadow: 0 2px 10px rgba(0,0,0,.06); transition: background .4s; }
  .wrap.flash { background: #FFF3D6; }
  .wrap.done { background: #E3F6E5; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .step { font-size: 1.05rem; font-weight: 600; }
  .clock { font-size: 3rem; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .desc { margin: 6px 0 12px; color: #5c5b6e; min-height: 2.6em; }
  .banner { display: none; margin: 0 0 12px; padding: 10px 14px; border-radius: 10px;
            background: #FFE3B0; color: #7a4a00; font-weight: 600; }
  .banner.show { display: block; }
  .bar { display: flex; gap: 4px; margin-bottom: 14px; }
  .seg { height: 10px; border-radius: 5px; background: #E6E3F5; overflow: hidden; }
  .seg > i { display: block; height: 100%; width: 0; background: #B9AFFF; }
  .seg.past > i { width: 100%; background: #9AD0C2; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { border: 0; border-radius: 10px; padding: 10px 16px; font-size: .95rem; cursor: pointer;
           background: #EEEBFF; color: #3b3a4a; }
  button.primary { background: #FF6B6B; color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .next { color: #8a889c; font-size: .9rem; margin-top: 10px; }
  .rec { margin-top: 16px; padding-top: 14px; border-top: 1px dashed #DDD8F5; }
  .rec[hidden], video[hidden], #result[hidden], button[hidden] { display: none; }
  .rec h4 { margin: 0 0 8px; font-size: 1rem; }
  .consent { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; margin-bottom: 10px; }
  .consent input { margin-top: 3px; }
  select { border: 1px solid #DDD8F5; border-radius: 8px; padding: 9px 10px; font-size: .9rem; background: #fff; color: #3b3a4a; }
  video { width: 100%; max-height: 260px; border-radius: 10px; background: #000; margin-top: 10px; }
  .recstat { margin-top: 8px; font-size: .9rem; color: #5c5b6e; }
  .recstat.rec { color: #E03131; font-weight: 700; }
  .recstat.warn { color: #B5495B; font-weight: 600; }
  .recstat.ok { color: #2E7D4F; font-weight: 600; }
  .hint { margin-top: 8px; font-size: .75rem; color: #8a889c; }
</style>

<div class="wrap" id="wrap">
  <div class="top">
    <div class="step" id="step"></div>
    <div class="clock" id="clock">00:00</div>
  </div>
  <div class="desc" id="desc"></div>
  <div class="banner" id="banner"></div>
  <div class="bar" id="bar"></div>
  <div class="row">
    <button class="primary" id="start">&#9654; Start lesson</button>
    <button id="pause" disabled>&#9208; Pause</button>
    <button id="skip" disabled>&#9197; Next step</button>
    <button id="reset">&#8634; Reset</button>
    <button id="sound">&#128266; Sound on</button>
  </div>
  <div class="next" id="next"></div>

  <div class="rec" id="rec" hidden>
    <h4>&#127909; Record what they learned</h4>
    <label class="consent"><input type="checkbox" id="consent">
      <span>I have the parent/guardian's consent to record video of this student.</span></label>
    <div class="row">
      <select id="cam" aria-label="Camera"><option value="environment">Back camera</option><option value="user">Front camera</option></select>
      <button class="primary" id="recBtn" disabled>&#127909; Start recording</button>
      <button id="recStop" hidden>&#9209;&#65039; Stop</button>
    </div>
    <video id="preview" muted playsinline hidden></video>
    <div class="recstat" id="recstat"></div>
    <div id="result" hidden>
      <video id="playback" controls playsinline></video>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="save">&#128190; Save to this device</button>
        <button id="discard">&#128465;&#65039; Discard</button>
      </div>
    </div>
    <div class="hint">The video stays on this device only &mdash; nothing is uploaded. Save it before leaving this page, and delete it when it is no longer needed.</div>
  </div>
</div>

<script>
let BLOCKS = [], SEC_PER_MIN = 60, STUDENT = "student", initKey = null;
const el = id => document.getElementById(id);

let idx = 0, remaining = 0, running = false, endAt = 0, started = false, finished = false;
let soundOn = true, ctx = null, wakeLock = null, bannerTimer = null;

const durMs = i => BLOCKS[i].duration_min * SEC_PER_MIN * 1000;

// ---- audio: soft, low sine beeps (kind to sound-sensitive students) --------
function beep(times, freq, len) {
  if (!soundOn || !ctx) return;
  for (let n = 0; n < times; n++) {
    const t0 = ctx.currentTime + n * (len + 0.18);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = "sine"; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + len + 0.02);
  }
}
function buzz() { try { navigator.vibrate && navigator.vibrate([180, 90, 180]); } catch (e) {} }

async function keepAwake() {
  try { if (navigator.wakeLock && running) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { keepAwake(); tick(); } });

// ---- video recording (device-only) -----------------------------------------
let stream = null, mr = null, chunks = [], recStart = 0, recClock = null, blobUrl = null, blobExt = "webm";
let recording = false, saved = false, saving = false, panelWas = null;
let savedMsg = "✓ Saved to this device's downloads.", saveNote = "";
const MAX_REC_SEC = 300;

function pickMime() {
  if (!window.MediaRecorder) return "";
  return ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"]
    .find(t => MediaRecorder.isTypeSupported(t)) || "";
}
function recMsg(text, cls) { el("recstat").textContent = text || ""; el("recstat").className = "recstat " + (cls || ""); }
function send(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
}
function resizeFrame() {
  send("streamlit:setFrameHeight", { height: Math.ceil(el("wrap").getBoundingClientRect().height) + 8 });
}
function fmtSec(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

function updateRec() {
  const inShowcase = started && !finished && BLOCKS[idx].type === "showcase";
  const show = inShowcase || recording || !!blobUrl;
  el("rec").hidden = !show;
  el("recBtn").disabled = !el("consent").checked || recording;
  el("recBtn").hidden = recording;
  el("recStop").hidden = !recording;
  el("consent").disabled = recording;
  el("result").hidden = !blobUrl || recording;
  if (recording) recMsg("● REC " + fmtSec(Math.floor((Date.now() - recStart) / 1000)), "rec");
  else if (blobUrl) recMsg(saving ? "Preparing the file…" : saved ? savedMsg : (saveNote || "⚠ Not saved yet — tap Save before leaving this page."), saved ? "ok" : "warn");
  else if (inShowcase && !el("recstat").textContent) recMsg("Tick the consent box, then tap Start recording when the student is ready.");
  if (panelWas !== show) { panelWas = show; resizeFrame(); }
}

async function startRecording() {
  if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    recMsg("Video recording isn't supported in this browser or app. Use Chrome or Edge, or record with your phone's camera app.", "warn"); resizeFrame(); return;
  }
  discardRecording();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: el("cam").value } }, audio: true });
  } catch (e) {
    const m = { NotAllowedError: "Camera or microphone is blocked. Allow access for this site (lock icon next to the address bar), then try again.",
                NotFoundError: "No camera or microphone was found.", NotReadableError: "The camera is being used by another app." };
    recMsg(m[e.name] || ("Could not start the camera: " + e.message), "warn"); resizeFrame(); return;
  }
  const mime = pickMime();
  mr = new MediaRecorder(stream, Object.assign({ videoBitsPerSecond: 1500000 }, mime ? { mimeType: mime } : {}));
  chunks = [];
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = onRecordingStopped;
  el("preview").srcObject = stream; el("preview").hidden = false; el("preview").play().catch(() => {});
  mr.start(1000); recording = true; saved = false; recStart = Date.now();
  recClock = setInterval(() => { if ((Date.now() - recStart) / 1000 >= MAX_REC_SEC) stopRecording(); updateRec(); }, 500);
  updateRec(); resizeFrame();
}
function stopRecording() { if (mr && mr.state !== "inactive") mr.stop(); }
function onRecordingStopped() {
  clearInterval(recClock); recording = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; el("preview").srcObject = null; el("preview").hidden = true;
  const type = (mr && mr.mimeType) || "video/webm";
  blobExt = type.indexOf("mp4") >= 0 ? "mp4" : "webm";
  const blob = new Blob(chunks, { type: type }); chunks = [];
  if (blob.size === 0) { recMsg("Nothing was recorded.", "warn"); updateRec(); resizeFrame(); return; }
  blobUrl = URL.createObjectURL(blob); saved = false; el("playback").src = blobUrl;
  updateRec(); resizeFrame();
}
function discardRecording() {
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = null; saved = false; saveNote = ""; el("playback").removeAttribute("src"); recMsg("");
}

// Inside the Android app (Capacitor WebView) a blob: download does nothing, so hand the file to the
// native Filesystem + Share plugins instead. The bridge is injected into every frame of the app's
// origin; the parent frames are checked too in case it only reached the top one.
function capacitor() {
  for (const w of [window, window.parent, window.top]) {
    try {
      const c = w && w.Capacitor;
      if (c && typeof c.nativePromise === "function" && c.isNativePlatform && c.isNativePlatform()) return c;
    } catch (e) {}
  }
  return null;
}
const NATIVE_CHUNK = 3 * 1024 * 1024;   // multiple of 3 bytes, so each chunk is clean base64
function blobToBase64(b) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1] || "");
    r.onerror = () => rej(r.error);
    r.readAsDataURL(b);
  });
}
async function saveNative(cap, filename) {
  const blob = await (await fetch(blobUrl)).blob();
  const dir = "recordings";
  // keep only the latest copy in the app's cache
  try { await cap.nativePromise("Filesystem", "rmdir", { path: dir, directory: "CACHE", recursive: true }); } catch (e) {}
  const path = dir + "/" + filename;
  let uri = null;
  // written in pieces: one 30 MB message through the native bridge can choke low-memory phones
  for (let off = 0, n = 0; off < blob.size; off += NATIVE_CHUNK, n++) {
    const data = await blobToBase64(blob.slice(off, off + NATIVE_CHUNK));
    if (n === 0) uri = (await cap.nativePromise("Filesystem", "writeFile", { path: path, data: data, directory: "CACHE", recursive: true })).uri;
    else await cap.nativePromise("Filesystem", "appendFile", { path: path, data: data, directory: "CACHE" });
  }
  await cap.nativePromise("Share", "share", { title: "BridgeNote lesson recording", dialogTitle: "Save or share the recording", files: [uri] });
}
async function saveRecording() {
  if (!blobUrl || saving) return;
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const filename = "bridgenote_" + STUDENT + "_" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()) + "." + blobExt;
  const cap = capacitor();
  if (cap) {
    saving = true; saveNote = ""; el("save").disabled = true; updateRec();
    try {
      await saveNative(cap, filename);
      saved = true; savedMsg = "✓ Sent to the share sheet — choose Drive, Files or another app to keep it.";
    } catch (e) {
      const m = String((e && e.message) || e);
      saveNote = /cancel/i.test(m) ? "Sharing was cancelled — tap Save again when you're ready." : "Could not save the recording: " + m;
    }
    saving = false; el("save").disabled = false; updateRec(); resizeFrame();
    return;
  }
  const a = document.createElement("a");
  a.href = blobUrl;
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  saved = true; savedMsg = "✓ Saved to this device's downloads."; updateRec();
}
el("consent").onchange = updateRec;
el("recBtn").onclick = startRecording;
el("recStop").onclick = stopRecording;
el("save").onclick = saveRecording;
el("discard").onclick = () => { if (saved || confirm("Discard this recording without saving it?")) { discardRecording(); updateRec(); resizeFrame(); } };

// ---- rendering ------------------------------------------------------------
function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function buildBar() {
  el("bar").innerHTML = "";
  BLOCKS.forEach((b, i) => {
    const seg = document.createElement("div");
    seg.className = "seg"; seg.style.flex = b.duration_min; seg.id = "seg" + i;
    seg.title = b.order + ". " + b.title;
    seg.appendChild(document.createElement("i"));
    el("bar").appendChild(seg);
  });
}
function render() {
  const b = BLOCKS[idx];
  el("step").textContent = finished ? "Lesson complete" : b.order + " / " + BLOCKS.length + " · " + b.title;
  el("desc").textContent = finished ? "Nice work! Remember to save lesson feedback for the next volunteer below." : b.description;
  el("clock").textContent = finished ? "00:00" : fmt(running ? endAt - Date.now() : remaining);
  const nb = BLOCKS[idx + 1];
  el("next").textContent = finished ? "" : (nb ? "Up next: " + nb.title + " (" + nb.duration_min + " min)" : "Last step of the lesson");
  BLOCKS.forEach((_, i) => {
    const seg = el("seg" + i);
    seg.className = "seg" + (finished || i < idx ? " past" : "");
    const fill = seg.firstChild;
    if (!finished && i === idx) {
      const left = running ? endAt - Date.now() : remaining;
      fill.style.width = (100 - Math.max(0, left) / durMs(i) * 100) + "%";
    } else fill.style.width = "";
  });
  el("wrap").classList.toggle("done", finished);
  el("pause").disabled = !started || finished;
  el("skip").disabled = !started || finished;
  el("pause").innerHTML = (running || !started || finished) ?"&#9208; Pause" : "&#9654; Resume";
  el("start").disabled = started;
  updateRec();
}
function announce(text) {
  el("banner").textContent = text; el("banner").classList.add("show");
  el("wrap").classList.add("flash");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { el("banner").classList.remove("show"); el("wrap").classList.remove("flash"); }, 8000);
}

// ---- timer core -----------------------------------------------------------
function goTo(i, cueNow) {
  if (i >= BLOCKS.length) {
    finished = true; running = false; started = true; stopRecording();
    if (cueNow) { beep(3, 392, 0.35); buzz(); }
    announce("Lesson time is up. Great job!");
    render(); return;
  }
  idx = i; remaining = durMs(i);
  if (running) endAt = Date.now() + remaining;
  if (cueNow) { beep(2, 440, 0.25); buzz(); announce("Time to move on → " + BLOCKS[i].order + ". " + BLOCKS[i].title); }
  render();
}
function tick() {
  if (!running) return;
  // catch up if the tab was throttled and several steps elapsed
  let cue = false;
  while (running && Date.now() >= endAt) {
    const carry = endAt;
    cue = true;
    if (idx + 1 >= BLOCKS.length) { goTo(BLOCKS.length, true); return; }
    idx++; remaining = durMs(idx); endAt = carry + remaining;
  }
  if (cue) { beep(2, 440, 0.25); buzz(); announce("Time to move on → " + BLOCKS[idx].order + ". " + BLOCKS[idx].title); }
  render();
}

el("start").onclick = () => {
  if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ctx && ctx.state === "suspended") ctx.resume();
  started = true; running = true; endAt = Date.now() + remaining;
  beep(1, 440, 0.2); keepAwake(); render();
};
el("pause").onclick = () => {
  if (running) { remaining = endAt - Date.now(); running = false; try { wakeLock && wakeLock.release(); } catch (e) {} }
  else { running = true; endAt = Date.now() + remaining; keepAwake(); }
  render();
};
el("skip").onclick = () => { goTo(idx + 1, false); if (running) el("banner").classList.remove("show"); };
el("reset").onclick = () => {
  if (blobUrl && !saved && !confirm("Reset the lesson? The unsaved recording will be discarded.")) return;
  stopRecording(); discardRecording();
  running = false; started = false; finished = false;
  try { wakeLock && wakeLock.release(); } catch (e) {}
  el("banner").classList.remove("show"); el("wrap").classList.remove("flash");
  goTo(0, false);
};
el("sound").onclick = () => {
  soundOn = !soundOn;
  el("sound").innerHTML = soundOn ? "&#128266; Sound on" : "&#128263; Sound off (visual only)";
};

function initFromArgs() {
  stopRecording(); discardRecording();
  clearTimeout(bannerTimer);
  idx = 0; running = false; started = false; finished = false;
  el("banner").classList.remove("show"); el("wrap").classList.remove("flash");
  buildBar(); goTo(0, false); resizeFrame();
}
window.addEventListener("message", ev => {
  const m = ev.data;
  if (!m || m.type !== "streamlit:render") return;
  const a = m.args || {};
  const key = JSON.stringify([a.blocks, a.sec_per_min, a.student]);
  // never throw away a recording that has not been saved yet
  const busy = recording || (blobUrl && !saved);
  if (key !== initKey && !busy) {
    initKey = key; BLOCKS = a.blocks || []; SEC_PER_MIN = a.sec_per_min || 60; STUDENT = a.student || "student";
    initFromArgs();
  }
  resizeFrame();
});
send("streamlit:componentReady", { apiVersion: 1 });
setInterval(() => { tick(); }, 250);
</script>
</body>
</html>
